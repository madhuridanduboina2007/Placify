{% extends "base.html" %}

{% block title %}
Edit Job | Placify
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <span class="auth-badge">
            Job Management
        </span>

        <h2>Edit Job</h2>

        <p>
            Update the job opportunity details.
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="company_id">
                    Select Company
                </label>

                <select name="company_id" id="company_id" required>

                    <option value="">
                        Select Company
                    </option>

                    {% for company in companies %}

                        <option
                            value="{{ company['id'] }}"
                            {% if company['id'] == job['company_id'] %}
                                selected
                            {% endif %}
                        >
                            {{ company['name'] }}
                        </option>

                    {% endfor %}

                </select>
            </div>


            <div class="form-group">

                <label for="job_title">
                    Job Title
                </label>

                <input
                    type="text"
                    name="job_title"
                    id="job_title"
                    value="{{ job['job_title'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Job Description
                </label>

                <textarea
                    name="description"
                    id="description"
                    rows="4"
                >{{ job['description'] or '' }}</textarea>

            </div>


            <div class="form-group">

                <label for="required_cgpa">
                    Required CGPA
                </label>

                <input
                    type="number"
                    name="required_cgpa"
                    id="required_cgpa"
                    step="0.01"
                    min="0"
                    max="10"
                    value="{{ job['required_cgpa'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="required_skills">
                    Required Skills
                </label>

                <textarea
                    name="required_skills"
                    id="required_skills"
                    rows="3"
                    placeholder="Example: Python, Flask, SQL, Git"
                    required
                >{{ job['required_skills'] or '' }}</textarea>

                <small>
                    Enter the skills separated by commas.
                </small>

            </div>


            <div class="form-group">

                <label for="salary">
                    Salary (Annual)
                </label>

                <input
                    type="number"
                    name="salary"
                    id="salary"
                    step="0.01"
                    value="{{ job['salary'] or '' }}"
                >

            </div>


            <div class="form-group">

                <label for="deadline">
                    Application Deadline
                </label>

                <input
                    type="date"
                    name="deadline"
                    id="deadline"
                    value="{{ job['deadline'] }}"
                    required
                >

            </div>


            <button type="submit" class="auth-btn">
                Update Job
            </button>

        </form>

        <br>

        <a href="{{ url_for('jobs') }}">
            ← Back to Jobs
        </a>

    </div>

</section>

{% endblock %}
