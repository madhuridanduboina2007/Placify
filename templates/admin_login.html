{% extends "base.html" %}

{% block title %}
Admin Login | Placify
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-icon">
            🛡️
        </div>

        <span class="auth-badge">
            Placify Administration
        </span>

        <h1>Admin Login</h1>

        <p class="auth-subtitle">
            Sign in to manage students, companies and placement opportunities.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button type="submit" class="auth-btn">
                Login to Admin Panel →
            </button>

        </form>

        <div class="auth-footer">

            <a href="{{ url_for('login') }}">
                Student Login
            </a>

        </div>

    </div>

</section>

{% endblock %}
