<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Placify{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="nav-container">

            <a href="/" class="logo">
                <span class="logo-icon">🎓</span>
                Placify
            </a>

            <div class="nav-links">

                <a href="{{url_for('home')}}" class="nav-link">Home</a>

                <a href="{{url_for('jobs')}}" class="nav-link">Jobs</a>

                <a href="{{url_for('companies')}}" class="nav-link">Companies</a>

                <a href="{{url_for('about')}}" class="nav-link">About</a>
                
                <a href="{{ url_for('register') }}" class="nav-link">
                    Register
                </a>
                <a href="{{ url_for('login') }}" class="login-btn">
                    Login
                </a>
                <a href="{{ url_for('admin_login') }}">Admin Login</a>

                

            </div>

        </div>
        <div class="theme-switcher">

            <button onclick="setTheme('dark')" title="Dark Theme">
                🌙
            </button>

            <button onclick="setTheme('light')" title="Light Theme">
                ☀️
            </button>

           <button onclick="setTheme('purple')" title="Purple Theme">
               💜
           </button>

        </div>

    </nav>


    <!-- Main Content -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- Footer -->

    <footer class="footer">

        <div class="footer-content">

            <div>
                <h3>🎓 Placify</h3>

                <p>
                    Connecting students with career opportunities.
                </p>
            </div>

            <div>
                <p>© 2026 Placify. All rights reserved.</p>
            </div>

        </div>

    </footer>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
